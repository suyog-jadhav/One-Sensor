; OneSensor — ESP32 Firmware
; PlatformIO project configuration
; See https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform  = espressif32
board     = esp32dev
framework = arduino

; Serial monitor speed (match Serial.begin() in main.cpp)
monitor_speed = 115200

; Upload/monitor port (ESP32 on /dev/ttyUSB0)
upload_port   = /dev/ttyUSB0
monitor_port  = /dev/ttyUSB0

; Upload speed
upload_speed  = 921600

; Library dependencies
; ESPAsyncWebServer + AsyncTCP for non-blocking WebSocket (Phase 8+)
; ArduinoJson v6 for JSON parsing (Phase 8+)
lib_deps =
    me-no-dev/ESPAsyncWebServer @ ^1.2.3
    me-no-dev/AsyncTCP @ ^1.1.1
    bblanchon/ArduinoJson @ ^6.21.3

; Build flags
; -DDEBUG enables verbose per-loop Serial logging (gate expensive logs behind this)
; Remove -DDEBUG for cleaner Serial output in production/demo mode
build_flags =
    -DCORE_DEBUG_LEVEL=0
    ; Uncomment to enable verbose debug logging:
    ; -DDEBUG

; Include path so #include "hardware_config.h" works without relative paths
build_src_filter = +<*> -<.git/>
