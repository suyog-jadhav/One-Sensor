sentence=12-channel virtual sensor platform — real-time PWM/DAC decoding from an ESP32 with dynamic runtime configuration.
paragraph=Decodes PWM and DAC signals from an ESP32 and exposes 12 clean sensor channels: temperature, humidity, gas, light, soil moisture, motion X/Y/Z, proximity, sound, UV index, and CO2. Supports runtime range/pin reconfiguration via setRange()/setPin()/configureChannel(), EEPROM persistence via saveConfig(), and serial provisioning with JSON commands. Designed for Arduino Uno/Mega with ESP32 as signal generator.
